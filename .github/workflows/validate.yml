name: Validate
on: [push, pull_request, workflow_dispatch]
# 상위(Team-intN18/Autumn-27/RuoJi6) 저장소가 삭제되어도 CI 가 깨지지 않도록 Go 테스트/빌드는
# 저장소에 커밋된 vendor/ 를 쓰고 proxy.golang.org 에 나가지 않는다. 의존성 업데이트가 필요하면
# PR 안에서만 GOFLAGS/GOPROXY 를 임시로 바꾼 뒤 vendor/ 를 재생성해 커밋한다.
env:
  GOFLAGS: -mod=vendor
  GOPROXY: off
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Compile every package, then exercise the CTF conversation path. The
      # legacy full suite includes platform-dependent shell-analysis fixtures
      # and background task timing tests; it is not the release smoke gate.
      - run: go test ./... -run '^$' -timeout=180s
      - run: go test ./agent ./server -run '^(TestCTF.*|TestCapture.*|TestModelMeter.*|TestHTTPObservation.*|TestFocusedHTML.*|TestResearchProgress.*|TestResearchExperiment.*|TestHostHTTP.*|TestAgentConnection.*|TestResearchRuntimeLinkedTaskRoot|TestResearchRuntimeProductionChat|TestWorkflowEntryDefaultsToTriageAndKeepsSelectedAgent|TestDelegationHonors.*|TestDelegatedConversationPersistsResult|TestConversationDelegationsIncludesNestedWorkers|TestReserveConversationTurn.*)$' -count=1 -timeout=180s
      - run: go test ./db ./config -count=1 -timeout=180s
      - run: python scripts/eval-ctf.py --self-test
      - run: node --test scripts/build-state.test.mjs
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - name: Build and smoke-test Unix launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p server/webui/dist
          cp -R web/out/. server/webui/dist/
          prtseek_SKIP_FRONTEND=1 prtseek_OUTPUT="$PWD/prtseek" bash build.sh
          go test -tags embedui ./server -run TestEmbeddedWorkbenchRoutes -count=1
          python scripts/smoke.py ./prtseek --launcher ./start.sh
      - name: Build and smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force server/webui/dist | Out-Null
          Copy-Item web/out/* server/webui/dist -Recurse -Force
          $version = (Get-Content VERSION -Raw).Trim()
          go build -tags embedui -ldflags "-X main.version=$version" -o prtseek.exe ./cmd/prtseek
          node scripts/build-state.mjs write ./prtseek.exe
          go test -tags embedui ./server -run TestEmbeddedWorkbenchRoutes -count=1
          python scripts/smoke.py ./prtseek.exe
          python scripts/test-windows-launcher.py ./prtseek.exe
      - name: Browser theme, boot animation and update regression
        if: runner.os == 'Linux'
        run: |
          cd web
          npx playwright install --with-deps chromium
          cd ..
          node scripts/check-ui.cjs ./prtseek
      - name: Check Windows release launcher packaging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          prtseek_SKIP_FRONTEND=1 prtseek_PACKAGE=1 bash build.sh --target windows/amd64
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*windows-amd64.zip')[0]); names={p.rsplit('/',1)[-1] for p in z.namelist()}; assert {'prtseek.exe','prtseek.exe.build.json','start.bat','start-prtseek.cmd','start-prtseek.ps1','update-prtseek.cmd','VERSION'} <= names"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: browser-regression
          path: .dev/ui-check/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t prtseek:ci .
      - name: Container health, replacement and persistence
        run: python3 scripts/smoke-container.py prtseek:ci
