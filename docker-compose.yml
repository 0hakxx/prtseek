services:
  prtseek:
    # 로컬 빌드가 기본이다. 미리 빌드해 둔 레지스트리 이미지를 쓰려면
    #   PRTSEEK_IMAGE=ghcr.io/0hakxx/prtseek:latest docker compose up -d --no-build
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26.10-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-python:3.12-slim-bookworm}
    image: ${PRTSEEK_IMAGE:-prtseek:local}
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    environment:
      prtseek_DB_PATH: /app/data/prtseek.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      prtseek_LLM_PROVIDER: ${prtseek_LLM_PROVIDER:-}
      prtseek_LLM_MODEL: ${prtseek_LLM_MODEL:-}
      prtseek_LLM_BASE_URL: ${prtseek_LLM_BASE_URL:-}
      prtseek_LLM_PROXY: ${prtseek_LLM_PROXY:-}
      prtseek_CTF_MODEL_CALL_LIMIT: ${prtseek_CTF_MODEL_CALL_LIMIT:-200}
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped
